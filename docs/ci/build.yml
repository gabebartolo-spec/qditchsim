name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:itch
      - uses: actions/upload-artifact@v4
        with:
          name: qditchsim-itch
          path: build/qditchsim-itch.zip
